# cargo-audit configuration.
#
# Accepted-risk advisory ignores. Every entry must be a SPECIFIC advisory ID,
# never a blanket crate exclusion, so any new or different advisory in the same
# crate still fails the audit, and each one needs its rationale written here.
# None are accepted today: the AWS SDK's legacy hyper-rustls 0.24 / rustls 0.21
# chain, the source of every earlier ignore, is no longer part of the build.

[advisories]
ignore = []
