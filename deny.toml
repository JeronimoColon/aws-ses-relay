# cargo-deny configuration. Run: cargo deny check
#
# Supply-chain policy for the dependency tree: permissive licenses only,
# crates.io as the only source, the same accepted-risk advisories that
# .cargo/audit.toml documents, and a ban on the AWS SDK's legacy TLS stack.

[licenses]
# Every crate in the tree resolves to one of these permissive licenses.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# r-efi is LGPL-2.1-or-later, but it is a UEFI-target-only transitive dependency
# (pulled in via getrandom/wasi) that is never compiled into this aarch64-linux
# Lambda binary, so it carries no copyleft obligation for the shipped artifact.
[[licenses.exceptions]]
name = "r-efi"
allow = ["LGPL-2.1-or-later"]

[advisories]
# Accepted-risk advisories, kept in sync with .cargo/audit.toml (the full
# rationale lives there). None are accepted today.
ignore = []

[bans]
# The AWS SDK pulls in a few duplicate crate majors (e.g. two http lines); they
# coexist without conflict, so duplicates are allowed rather than failing the build.
multiple-versions = "allow"

# The AWS SDK's legacy hyper 0.14 / rustls 0.21 stack is kept out of the build
# by the feature list in Cargo.toml. These bans fail the build if anything
# brings it back, so its removal does not depend on a new advisory appearing.
# Use the name + version form: cargo-deny does not read `crate@<range>` as a
# version range.
deny = [
    { name = "hyper", version = "<1", reason = "legacy AWS SDK HTTP stack" },
    { name = "hyper-rustls", version = "<0.27", reason = "legacy AWS SDK TLS stack" },
    { name = "rustls", version = "<0.23", reason = "legacy AWS SDK TLS stack" },
    { name = "rustls-webpki", version = "<0.102", reason = "legacy AWS SDK TLS stack" },
    { name = "h2", version = "<0.4", reason = "legacy AWS SDK HTTP stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
