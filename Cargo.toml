[package]
name = "aws-ses-relay"
version = "0.1.7"
edition = "2021"
license = "MIT"
description = "AWS Lambda that forwards inbound SES email to configured destinations."
readme = "README.md"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
# The AWS crates below turn off their default features and list the defaults
# the relay uses. Left out on purpose:
# - `rustls` (aws-sdk-s3, aws-sdk-sesv2) pulls in the SDK's legacy hyper-rustls
#   0.24 / rustls 0.21 stack; the relay uses the hyper 1.x / rustls 0.23 client
#   from `default-https-client`. It can come back once the SDK drops the legacy
#   stack from its defaults (smithy-lang/smithy-rs#4651).
# - `sigv4a` (aws-sdk-s3, aws-sdk-sesv2) is SigV4a signing, used only for S3
#   multi-region access points. SES writes inbound mail to a plain bucket.
# - `sso` and `credentials-process` (aws-config) are sign-in methods for
#   developer machines. On Lambda, credentials come from the execution role.
# .github/scripts/check-sdk-feature-pin.sh fails if these lists drift from the
# crates' current defaults.
aws-config = { version = "1.13.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-s3 = { version = "1.156.0", default-features = false, features = [
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-sesv2 = { version = "1.144.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
lambda_runtime = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
# Test-only. Lets the idempotency tests run the real S3 claim/release paths
# against a replayed HTTP layer (StaticReplayClient) instead of live AWS. None
# of these are compiled into the release Lambda binary.
aws-smithy-runtime = { version = "1", features = ["client", "test-util"] }
aws-smithy-types = "1"
http = "1"
