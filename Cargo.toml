[package]
name = "aws-ses-relay"
version = "0.1.7"
edition = "2021"
license = "MIT"
description = "AWS Lambda that forwards inbound SES email to configured destinations."
readme = "README.md"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
aws-config = "1.13.0"
# Every default feature except `rustls`, which pulls in the SDK's legacy
# hyper-rustls 0.24 / rustls 0.21 stack. The relay uses the hyper 1.x / rustls
# 0.23 client from `default-https-client`, so the legacy stack only carried
# advisories. Return to plain version strings once the SDK drops it from its
# defaults (smithy-lang/smithy-rs#4651).
aws-sdk-s3 = { version = "1.156.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-sesv2 = { version = "1.144.0", default-features = false, features = [
    "sigv4a",
    "default-https-client",
    "rt-tokio",
] }
lambda_runtime = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
# Test-only. Lets the idempotency tests run the real S3 claim/release paths
# against a replayed HTTP layer (StaticReplayClient) instead of live AWS. None
# of these are compiled into the release Lambda binary.
aws-smithy-runtime = { version = "1", features = ["client", "test-util"] }
aws-smithy-types = "1"
http = "1"
