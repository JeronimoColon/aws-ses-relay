name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    name: Build, test, lint, cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable) with clippy, rustfmt, and the Lambda target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose

      # Install cargo-lambda and Zig with pinned versions (bump as needed).
      # `--break-system-packages` satisfies PEP 668 on the runner's externally
      # managed Python.
      - name: Install cargo-lambda and Zig
        run: pip3 install --break-system-packages 'cargo-lambda==1.9.2' 'ziglang==0.14.0'

      - name: Cross-compile for Lambda (ARM64) - proves it builds for the runtime
        run: cargo lambda build --release --arm64

  coverage:
    name: Test coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable) with the LLVM coverage tools
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-llvm-cov

      # Fail the build if line coverage drops below 90%. src/main.rs (the Lambda
      # bootstrap/wiring) is excluded: it needs the live runtime and is covered by
      # the container test, not unit tests. Everything else measures ~94% today.
      - name: Coverage gate (fail under 90% lines)
        run: cargo llvm-cov --locked --fail-under-lines 90 --ignore-filename-regex 'main\.rs$'

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-audit

      # Scans Cargo.lock against the RustSec advisory database. Fails on any
      # advisory except the specific IDs documented, with rationale, in
      # .cargo/audit.toml. Those ignores are per-advisory-ID, so a new or
      # different advisory still fails the build. Needs only read access
      # (inherited from the top-level permissions above).
      - name: cargo audit
        run: cargo audit

  deny:
    name: Supply-chain policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny

      # Enforces the supply-chain policy in deny.toml: permissive licenses only
      # (one documented LGPL exception for the UEFI-only r-efi crate), crates.io
      # as the only source, no banned crates, and the accepted-risk advisories.
      - name: cargo deny check
        run: cargo deny check
