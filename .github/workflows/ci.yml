name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    name: Build, test, lint, cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the Rust version and lists the components and
      # the Lambda target; `rustup toolchain install` with no arguments installs
      # exactly that (rustup 1.28 or newer).
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup --version
          rustup toolchain install
          rustc --version

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose

      # Install cargo-lambda and Zig with pinned versions (bump as needed).
      # `--break-system-packages` satisfies PEP 668 on the runner's externally
      # managed Python.
      - name: Install cargo-lambda and Zig
        run: pip3 install --break-system-packages 'cargo-lambda==1.9.2' 'ziglang==0.14.0'

      # Zero warnings is a release gate, but cargo-lambda cannot take -D warnings:
      # RUSTFLAGS would replace its own -C target-cpu. So the step fails if the
      # build prints any warning. `shell: bash` adds pipefail, so a failed build
      # is not hidden by tee, and color is off so the warning lines match.
      - name: Cross-compile for Lambda (ARM64) - proves it builds for the runtime
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo lambda build --release --arm64 --locked 2>&1 | tee lambda-build.log
          if grep -qE '^warning(\[|:)' lambda-build.log; then
            echo "::error::the Lambda build printed warnings (see above)"
            exit 1
          fi

  coverage:
    name: Test coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the Rust version and lists the components and
      # the Lambda target; `rustup toolchain install` with no arguments installs
      # exactly that (rustup 1.28 or newer).
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup --version
          rustup toolchain install
          rustc --version

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov

      # Fail the build if line coverage drops below 90%. src/main.rs (the Lambda
      # bootstrap/wiring) is excluded: it needs the live runtime and is covered by
      # the container test, not unit tests. Everything else measures ~94% today.
      - name: Coverage gate (fail under 90% lines)
        run: cargo llvm-cov --locked --fail-under-lines 90 --ignore-filename-regex 'main\.rs$'

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the Rust version and lists the components and
      # the Lambda target; `rustup toolchain install` with no arguments installs
      # exactly that (rustup 1.28 or newer).
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup --version
          rustup toolchain install
          rustc --version

      - name: Install cargo-audit
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit

      # Scans Cargo.lock against the RustSec advisory database. Fails on any
      # advisory except the specific IDs documented, with rationale, in
      # .cargo/audit.toml. Those ignores are per-advisory-ID, so a new or
      # different advisory still fails the build. Needs only read access
      # (inherited from the top-level permissions above).
      - name: cargo audit
        run: cargo audit

  deny:
    name: Supply-chain policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the Rust version and lists the components and
      # the Lambda target; `rustup toolchain install` with no arguments installs
      # exactly that (rustup 1.28 or newer).
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup --version
          rustup toolchain install
          rustc --version

      - name: Install cargo-deny
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny

      # Enforces the supply-chain policy in deny.toml: permissive licenses only
      # (one documented LGPL exception for the UEFI-only r-efi crate), crates.io
      # as the only source, no banned crates, and the accepted-risk advisories.
      - name: cargo deny check
        run: cargo deny check

      # aws-sdk-s3 and aws-sdk-sesv2 list their default features by hand (minus
      # `rustls`, which pulls in the SDK's legacy TLS stack). Fail if that copy
      # drifts from the crates' real defaults, so new defaults are adopted on
      # purpose rather than silently missed.
      - name: SDK feature pin matches the SDK defaults
        run: .github/scripts/check-sdk-feature-pin.sh
