# The Rust version every build uses: CI, the release pipeline, and local work.
# Dependabot opens a pull request when a new Rust release is available, so moving
# to it is a deliberate merge rather than something the runners do on their own.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["clippy", "rustfmt", "llvm-tools-preview"]
targets = ["aarch64-unknown-linux-gnu"]
